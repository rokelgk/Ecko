<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; font-size: 12px; color: var(--uxp-host-text-color, #ddd); padding: 8px; }
    label { display: block; margin: 8px 0 2px; }
    select, input[type=range] { width: 100%; }
    button { width: 100%; margin-top: 12px; padding: 6px; }
    .hint { opacity: .7; margin-top: 6px; }
    #status { margin-top: 10px; min-height: 2em; }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <label>Look <select id="preset"></select></label>
  <label>Pattern <select id="style"></select></label>
  <label>Lines per inch: <span id="lpiOut"></span> <input type="range" id="lpi" min="5" max="150" step="1" value="35"></label>
  <label>Angle: <span id="angleOut"></span> <input type="range" id="angle" min="0" max="180" step="0.5" value="22.5"></label>
  <label>Shirt colour <select id="garment"></select></label>
  <label>Fit to shirt <select id="fit"></select></label>
  <label>Printing on <select id="target"></select></label>
  <label>Border <select id="border"></select></label>
  <label>Border shape <select id="borderShape"></select></label>
  <label>Border width: <span id="borderOut"></span> mm <input type="range" id="borderMm" min="2" max="80" step="1" value="15"></label>
  <button id="run">Halftone selected layer</button>
  <p class="hint">Makes a new layer above the selected one. Your original layer is left alone.
    Everything runs inside Photoshop: no server, no internet.</p>
  <div id="status"></div>
  <script src="index.js"></script>
</body>
</html>
