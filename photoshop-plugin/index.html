<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* Photoshop panels don't scroll on their own: the settings live in an absolutely positioned
       scrolling area, and the action bar is pinned to the bottom so it is always visible. */
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    body { font-family: sans-serif; font-size: 12px; color: var(--uxp-host-text-color, #ddd);
      background: var(--uxp-host-background-color, transparent); }
    #scroller { position: absolute; top: 0; left: 0; right: 0; bottom: 96px; overflow-y: scroll; padding: 8px 10px 12px; }
    #footer { position: absolute; left: 0; right: 0; bottom: 0; height: 96px; padding: 8px 10px; box-sizing: border-box;
      border-top: 1px solid rgba(128, 128, 128, 0.45); background: var(--uxp-host-background-color, #323232); }
    .field { margin: 0 0 10px; }
    .title { display: flex; justify-content: space-between; margin-bottom: 3px; }
    .value { opacity: 0.85; }
    select, input[type=range] { width: 100%; }
    .hint { opacity: 0.7; margin: 4px 0 0; }
    #run { width: 100%; padding: 6px; font-weight: bold; }
    #status { margin-top: 6px; max-height: 44px; overflow-y: auto; font-size: 11px; line-height: 1.3; }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <div id="scroller">
    <div class="field"><div class="title"><span>Look</span></div><select id="preset"></select></div>
    <div class="field"><div class="title"><span>Pattern</span></div><select id="style"></select></div>
    <div class="field">
      <div class="title"><span>Lines per inch</span><span class="value" id="lpiOut"></span></div>
      <input type="range" id="lpi" min="5" max="150" step="1" value="35">
    </div>
    <div class="field">
      <div class="title"><span>Angle</span><span class="value" id="angleOut"></span></div>
      <input type="range" id="angle" min="0" max="180" step="0.5" value="22.5">
    </div>
    <div class="field"><div class="title"><span>Shirt colour</span></div><select id="garment"></select></div>
    <div class="field"><div class="title"><span>Fit to shirt</span></div><select id="fit"></select></div>
    <div class="field"><div class="title"><span>Printing on</span></div><select id="target"></select></div>
    <div class="field"><div class="title"><span>Border</span></div><select id="border"></select></div>
    <div class="field"><div class="title"><span>Border shape</span></div><select id="borderShape"></select></div>
    <div class="field">
      <div class="title"><span>Border width</span><span class="value" id="borderOut"></span></div>
      <input type="range" id="borderMm" min="2" max="80" step="1" value="15">
    </div>
    <p class="hint">Makes a new layer above the selected one. Your original layer is left alone.
      Everything runs inside Photoshop: no server, no internet. Scroll for more settings.</p>
  </div>
  <div id="footer">
    <button id="run">Halftone selected layer</button>
    <div id="status"></div>
  </div>
  <script src="index.js"></script>
</body>
</html>
